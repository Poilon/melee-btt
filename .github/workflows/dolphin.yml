name: Build TTRC Dolphin
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows update installation and rollback
        run: node test/windows/updater.mjs
      - uses: actions/checkout@v4
        with:
          repository: project-slippi/Ishiiruka
          ref: e7711b104b339a99385f2bb12b472d46140a7bc7
          path: upstream
          submodules: recursive
      - run: python scripts/patch_dolphin.py upstream
      - name: Rust version
        id: rust
        shell: bash
        run: echo "version=$(sed -rn 's/^channel = "(.*)"/\1/p' upstream/Externals/SlippiRustExtensions/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          rustflags: ''
      - uses: microsoft/setup-msbuild@v2
      - name: Check native integration against wxWidgets
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.2
          cl /nologo /Zs /EHsc /W3 /WX /D_CRT_SECURE_NO_WARNINGS /DWIN32_LEAN_AND_MEAN /DNOMINMAX /D_UNICODE /DUNICODE /Iupstream\Externals\wxWidgets3\include /Iupstream\Externals\wxWidgets3 dolphin\compile_check.cpp
      - name: DirectX SDK
        run: |
          choco install directx-sdk --no-progress -y
          $sdk = "${env:ProgramFiles(x86)}\Microsoft DirectX SDK (June 2010)\"
          if (!(Test-Path ($sdk + 'Include\d3dx9.h'))) { throw 'DirectX SDK headers are missing' }
          "DXSDK_DIR=$sdk" >> $env:GITHUB_ENV
      - name: Build
        shell: cmd
        run: msbuild upstream\Source\Dolphin.sln /m:4 /p:PreferredToolArchitecture=x64 /p:Configuration=Release /p:Platform=x64
      - name: Package executable and matching source
        shell: bash
        run: |
          mkdir -p dolphin-build
          cp "upstream/Binary/x64/Slippi Dolphin.exe" dolphin-build/'Slippi Dolphin.exe'
          cp upstream/license.txt dolphin-build/LICENSE-Dolphin.txt
          tar --exclude=.git --exclude=Build --exclude=Binary --exclude=target -czf dolphin-build/TTRC-Dolphin-Source.tar.gz -C upstream .
      - uses: actions/upload-artifact@v4
        with:
          name: ttrc-dolphin
          path: dolphin-build
