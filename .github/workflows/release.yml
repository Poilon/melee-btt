name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: node scripts/build_release.mjs
        env:
          TTRC_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: TTRC-Windows-x64
          path: |
            build/release/TTRC-Windows-x64.zip
            build/release/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/TTRC-Windows-x64.zip build/release/SHA256SUMS.txt --generate-notes --title "TTRC Companion $GITHUB_REF_NAME"
