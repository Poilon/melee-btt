name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dolphin:
    uses: ./.github/workflows/dolphin.yml
  package:
    needs: dolphin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - uses: actions/download-artifact@v4
        with:
          name: ttrc-dolphin
          path: build/dolphin-build
      - run: node scripts/build_release.mjs
        env:
          TTRC_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.9.7' }}
      - uses: actions/upload-artifact@v4
        with:
          name: Custom-Melee-BTT-Windows-x64
          path: |
            build/release/Custom-Melee-BTT-Windows-x64.zip
            build/release/TTRC-Windows-x64.zip
            build/release/Custom-Melee-BTT-v*-Beta-Windows-x64.zip
            build/release/SHA256SUMS.txt
            build/release/Custom-Melee-BTT-Dolphin-Source.tar.gz
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/Custom-Melee-BTT-Windows-x64.zip build/release/TTRC-Windows-x64.zip build/release/Custom-Melee-BTT-v*-Beta-Windows-x64.zip build/release/SHA256SUMS.txt build/release/Custom-Melee-BTT-Dolphin-Source.tar.gz --generate-notes --title "Custom Melee BTT Beta $GITHUB_REF_NAME"
