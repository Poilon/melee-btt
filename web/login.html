<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Sign in · TTRC</title><link rel="icon" href="/favicon-site.svg" type="image/svg+xml"><link rel="stylesheet" href="/login.css"><script type="module" src="/login.js"></script></head>
<body><header><a class="brand" href="/"><img src="/target.svg" width="32" height="32" alt="">TTRC</a><a href="/">Leaderboard ↗</a></header>
<main><section class="card" aria-labelledby="title"><div class="art" aria-hidden="true"><img src="/assets/melee/fox.webp" alt=""></div><div class="content" id="content">
<p class="eyebrow">TTRC DOLPHIN</p><h1 id="title">Sign in</h1><p id="description">Sign in here to connect your game.</p>
<p id="status" role="status">Loading…</p><p id="error" role="alert"></p>
<div id="account" hidden><button id="continue" class="primary">Continue</button><button id="switch-account" class="secondary">Use another account</button></div>
<form id="form" hidden><label for="username">Username</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button id="submit" class="primary" type="submit">Sign in and connect</button><button id="mode" class="secondary" type="button">Create an account</button></form>
<div id="complete" hidden><span class="check" aria-hidden="true">✓</span><p>You can close this tab and return to the game.</p><a href="/">View leaderboard ↗</a></div>
<button id="retry" class="secondary" hidden>Try again</button>
</div></section></main></body></html>
